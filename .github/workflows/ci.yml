name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npm run lint
        working-directory: client

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: server
      - run: npx prisma generate
        working-directory: server
        env:
          DATABASE_URL: postgresql://chronicle:ci-only@127.0.0.1:5432/chronicle
      - run: npm run build
        working-directory: server
      - run: npm test
        working-directory: server
