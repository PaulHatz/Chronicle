
name: Deploy Chronicle

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: chronicle-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Build frontend
        working-directory: client
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build

      - name: Build backend
        working-directory: server
        env:
          # Build/test only. The production DB URL remains on the VPS.
          DATABASE_URL: postgresql://chronicle:ci-only@127.0.0.1:5432/chronicle
        run: |
          npm ci --no-audit --no-fund
          npx prisma generate
          npm run build
          npm test

      - name: Package application
        run: |
          tar -czf client-release.tar.gz -C client dist
          tar -czf server-release.tar.gz -C server \
            dist package.json package-lock.json prisma.config.ts prisma

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload application
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          scp -P "$PORT" -o BatchMode=yes \
            client-release.tar.gz server-release.tar.gz \
            "$USER@$HOST:/home/deploy/"

      - name: Install and restart
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          ssh -p "$PORT" -o BatchMode=yes \
            "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          tar -xzf ~/client-release.tar.gz \
            -C /opt/chronicle/client

          tar -xzf ~/server-release.tar.gz \
            -C /opt/chronicle/server

          cd /opt/chronicle/server
          # The Prisma CLI is a dev dependency; it is needed to apply migrations.
          npm ci --include=dev --no-audit --no-fund

          # Preserve the database and secrets. Apply only committed migrations,
          # never db push / migrate dev / reset against production.
          if [ -f prisma/migrations/migration_lock.toml ]; then
            npx --no-install prisma migrate deploy
          else
            echo "No version-controlled Prisma migrations yet; skipping schema changes."
          fi

          sudo -n systemctl restart chronicle.service

          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3000/ \
              >/dev/null; then
              echo "Chronicle API is responding"
              exit 0
            fi
            sleep 2
          done

          echo "Chronicle API health check failed"
          exit 1
          REMOTE
